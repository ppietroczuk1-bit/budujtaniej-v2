<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BudujTaniej v2</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f4f4;
}

header{
background:#0f766e;
color:white;
text-align:center;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
background:#0f766e;
color:white;
border:none;
padding:12px 20px;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

button:hover{
background:#0c5f59;
}

#status{
margin-top:15px;
font-weight:bold;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>
<body>

<header>
<h1>BudujTaniej.pl v2</h1>
<p>Rejestracja i logowanie użytkowników</p>
</header>

<div class="container">

<div class="card">

<h2>Logowanie i rejestracja</h2>

<input
type="email"
id="email"
placeholder="Adres e‑mail">

<input
type="password"
id="password"
placeholder="Hasło">

<select id="rola">
<option value="inwestor">Inwestor</option>
<option value="wykonawca">Wykonawca</option>
</select>

<button onclick="register()">
Zarejestruj
</button>

<button onclick="login()">
Zaloguj
</button>

<div id="status"></div>

</div>

</div>

<footer>
BudujTaniej.pl v2
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyCdYKfGbieiIbXPmvBG8XsKNXrhQdsmDZk",
authDomain: "budujtaniej-48f81.firebaseapp.com",
projectId: "budujtaniej-48f81",
storageBucket: "budujtaniej-48f81.firebasestorage.app",
messagingSenderId: "1004917098674",
appId: "1:1004917098674:web:712784a60d8d15d46661ab"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(db,"users",userCredential.user.uid),
{
email: email,
rola: document.getElementById("rola").value,
dataRejestracji: new Date().toISOString()
}
);

document.getElementById("status").innerHTML =
"✅ Rejestracja zakończona";

}
catch(error){

document.getElementById("status").innerHTML =
error.message;

}

}

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

document.getElementById("status").innerHTML =
"✅ Zalogowano";

}
catch(error){

document.getElementById("status").innerHTML =
error.message;

}

}

</script>

</body>
</html>
